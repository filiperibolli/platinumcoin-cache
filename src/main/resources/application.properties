spring.application.name=platinumcoin-cache
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/platinumcoin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=senha
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# Logging
logging.level.org.springframework=INFO
logging.level.com.platinumcoin.cache=DEBUG